name: CI

on:
  push:
    branches:
      - main
      - develop
      - 's0/**'
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GestIA.slnx

      - name: Test
        run: dotnet test GestIA.slnx --configuration Release --no-restore

  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test -- --watch=false

      - name: Build
        run: npm run build

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    env:
      GESTIA_SQL_PASSWORD: Only_for_compose_validation_2026!

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag gestia/backend:ci .

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag gestia/frontend:ci .
