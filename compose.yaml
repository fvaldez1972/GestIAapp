name: gestia

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${GESTIA_SQL_PASSWORD:?Copy .env.example to .env and set GESTIA_SQL_PASSWORD}"
    ports:
      - "${GESTIA_SQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    security_opt:
      - no-new-privileges:true

  database-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${GESTIA_SQL_PASSWORD:?Copy .env.example to .env and set GESTIA_SQL_PASSWORD}"
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b
        -Q "IF DB_ID(N'${GESTIA_SQL_DATABASE:-db-gestia-dev}') IS NULL EXEC(N'CREATE DATABASE [${GESTIA_SQL_DATABASE:-db-gestia-dev}]');"
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    image: gestia/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__GestIa: "Server=sqlserver,1433;Database=${GESTIA_SQL_DATABASE:-db-gestia-dev};User Id=sa;Password=${GESTIA_SQL_PASSWORD:?Copy .env.example to .env and set GESTIA_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True;ConnectRetryCount=5"
      Jwt__Issuer: GestIA
      Jwt__Audience: GestIA.Web
      Jwt__Secret: "${GESTIA_JWT_SECRET:?Copy .env.example to .env and set GESTIA_JWT_SECRET}"
      BootstrapAdmin__Email: "${GESTIA_BOOTSTRAP_ADMIN_EMAIL:-admin@gestia.local}"
      BootstrapAdmin__Password: "${GESTIA_BOOTSTRAP_ADMIN_PASSWORD:-GestIA.Local.2026!}"
    ports:
      - "${GESTIA_API_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

  frontend:
    image: gestia/frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${GESTIA_WEB_PORT:-4200}:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  mssql-data:
