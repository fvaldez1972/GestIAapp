<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:17rem;flex:none;height:100%;min-height:100%;box-sizing:border-box;background:#10104e;display:flex;flex-direction:column;padding:20px 0 16px;font-family:Archivo,sans-serif">
  <div style="padding:0 20px 22px;display:flex;align-items:center;gap:10px">
    <span style="width:26px;height:26px;border:1.5px solid #22c6ee;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 13px Archivo,sans-serif;color:#22c6ee">G</span>
    <span style="font:700 16px/1 Archivo,sans-serif;color:#ffffff;letter-spacing:.02em">GestIA</span>
  </div>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="11">
    <div style="display:flex;align-items:center;gap:11px;padding:10px 20px;background:{{ it.bg }};border-left:3px solid {{ it.mark }};font-size:13px;font-weight:{{ it.weight }};color:{{ it.color }}">
      <span style="width:6px;height:6px;border-radius:50%;background:{{ it.dot }};flex:none"></span>
      <span>{{ it.name }}</span>
    </div>
  </sc-for>
  <div style="margin-top:auto;padding:16px 20px 0;border-top:1px solid #1c1c66;display:flex;flex-direction:column;gap:3px">
    <span style="font:600 12.5px Archivo,sans-serif;color:#ffffff">{{ usuario }}</span>
    <span style="font:400 11px Archivo,sans-serif;color:#e9f7fa">{{ rolTexto }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:272,&quot;height&quot;:620},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Servicios&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;super-org&quot;,&quot;super&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;super-org&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;usuario&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Renata Villaseñor&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const todos = ['Inicio','Organizaciones','Catálogos','Clientes','Servicios','Personal','Planeación','Asistencia','Incidencias','Cobertura','Seguridad'];
    const rol = this.props.role || 'super-org';
    const base = rol === 'super' ? ['Inicio','Organizaciones','Seguridad']
      : rol === 'admin' ? todos.filter(m => m !== 'Organizaciones')
      : todos;
    const active = this.props.active || 'Servicios';
    return {
      items: base.map(name => {
        const on = name === active;
        return {
          name,
          bg: on ? '#1c1c66' : 'transparent',
          mark: on ? '#22c6ee' : 'transparent',
          color: on ? '#ffffff' : '#e9f7fa',
          dot: on ? '#22c6ee' : '#1c1c66',
          weight: on ? 600 : 400
        };
      }),
      usuario: this.props.usuario ?? 'Renata Villaseñor',
      rolTexto: rol === 'admin' ? 'Administrador de organización' : 'Super administrador'
    };
  }
}
</script>
</body>
</html>
