<main class="login-shell">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="brand">
      <span class="brand-mark">G</span>
      <div>
        <strong>GestIA</strong>
        <span>Gestión inteligente</span>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="form-heading">
        <p>Acceso seguro</p>
        <h1 id="login-title">Inicia sesión</h1>
        <span>Entra a clientes, personal, planeación y operación diaria.</span>
      </div>

      @if (error()) {
        <p class="alert">{{ error() }}</p>
      }

      <label>
        <span>Correo</span>
        <input type="email" autocomplete="username" formControlName="email" placeholder="tu-correo@empresa.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">Escribe un correo válido.</small>
        }
      </label>

      <label>
        <span>Contraseña</span>
        <input type="password" autocomplete="current-password" formControlName="password" placeholder="Ingresa tu contraseña" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">La contraseña es obligatoria.</small>
        }
        <small class="field-help">Por seguridad el navegador oculta la contraseña con puntos o asteriscos.</small>
      </label>

      <button type="submit" [disabled]="!canSubmit()">
        {{ loading() ? 'Validando acceso…' : 'Entrar a GestIA' }}
      </button>

      <aside class="login-help">
        <strong>Acceso autorizado</strong>
        <span>Ingresa con el usuario asignado por el administrador de GestIA.</span>
      </aside>
    </form>
  </section>
</main>
