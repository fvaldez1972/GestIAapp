<main class="login-shell">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="brand">
      <span class="brand-mark">G</span>
      <div>
        <strong>GestIA</strong>
        <span>Gestión inteligente</span>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="form-heading">
        <p>Acceso seguro</p>
        <h1 id="login-title">Inicia sesión</h1>
        <span>Entra a clientes, personal, planeación y operación diaria.</span>
      </div>

      @if (error()) {
        <p class="alert">{{ error() }}</p>
      }

      <label>
        <span>Correo</span>
        <input type="email" autocomplete="username" formControlName="email" />
      </label>

      <label>
        <span>Contraseña</span>
        <input type="password" autocomplete="current-password" formControlName="password" />
      </label>

      <button type="submit" [disabled]="!canSubmit()">
        {{ loading() ? 'Validando acceso…' : 'Entrar a GestIA' }}
      </button>

      <aside class="login-help">
        <strong>Ambiente local</strong>
        <span>Usa las credenciales de desarrollo mientras cerramos el piloto.</span>
      </aside>
    </form>
  </section>
</main>
